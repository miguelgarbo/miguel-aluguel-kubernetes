# Define a versão da API do Kubernetes utilizada para este recurso.
apiVersion: v1
# Secret armazena informações sensíveis utilizadas pela aplicação, como senhas e tokens.
kind: Secret
metadata:
  # Nome utilizado para referenciar este Secret no Deployment.
  name: backend-secret
  # Namespace em que o recurso será criado.
  namespace: miguel-aluguel
# Tipo Opaque indica que o Secret armazena dados genéricos, sem uma estrutura específica exigida pelo Kubernetes.
type: Opaque
# Define os valores em texto simples no manifesto. O Kubernetes os converte para o formato interno de dados do Secret.
stringData:
  # Senha utilizada pelo backend para conectar ao PostgreSQL.
  DB_PASSWORD: miguel123
  # Token secreto utilizado pela aplicação para operações relacionadas a hash ou autenticação, conforme sua implementação.
  # O valor pode ser gerado com o comando: openssl rand -base64 48
  HASH_TOKEN: /JWAsECGMT6eeVSlblo4mT+tGKwK5BYckJ8c/jNA7Dx3idovfI5UHu1UyrHpqYnI

