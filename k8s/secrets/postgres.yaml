# Define a versão da API do Kubernetes utilizada para este recurso.
apiVersion: v1
# Secret armazena informações sensíveis ou configurações que precisam ser disponibilizadas aos containers.
kind: Secret
metadata:
  # Nome utilizado para referenciar este Secret no Deployment responsável pelo PostgreSQL.
  name: postgres-secret
  # Namespace em que o recurso será criado.
  namespace: miguel-aluguel
# Define um Secret genérico, adequado para armazenar credenciais e outras informações da aplicação.
type: Opaque
# Permite declarar os valores em texto simples no manifesto.
# O Kubernetes converte esses valores para o formato interno do Secret, mas isso não garante criptografia em repouso.
stringData:
  # Nome do banco de dados que será criado na inicialização do container PostgreSQL, caso ainda não exista.
  POSTGRES_DB: miguel_aluguel
  # Usuário administrador utilizado na inicialização do banco.
  POSTGRES_USER: postgres
  # Senha definida para o usuário do banco de dados.
  # Deve corresponder à senha utilizada pelo backend para estabelecer a conexão com o PostgreSQL.
  POSTGRES_PASSWORD: miguel123

