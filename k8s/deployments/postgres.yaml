apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: miguel-aluguel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret

          volumeMounts:
            - name: postgres-data
              mountPath: /data/db
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
