apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: miguel-aluguel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # como o backend está em repo privado precisa de autenticação antes de puxar a imagem
      imagePullSecrets:
        - name: docker-secret

      containers:
        - name: backend
          image: miguelgarbo/miguel_aluguel_back_end:v.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret