#define e mantém a quantidade desejada de Pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: miguel-aluguel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  #DENTRO DA TAG TEMPLATE HÁ TODA DEFINIÇÃO DOS PODS
  #AQUI NO CASO ESTA DECLARANDO O POD DO FRONT END

  template:
    metadata:
      labels:
        #É AQUI NO LABEL ONDE HÁ A IDENTIFICAÇÃO DO POD PRO NOSSO SERVICE
        app: frontend
    spec:
      containers:
        #AQ EU PODERIA SUBIR MAIS DE UM CONTAINER
        - name: frontend
          image: miguelgarbo/miguel_aluguel_front_end:v8
          imagePullPolicy: IfNotPresent
          
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: frontend-config
            