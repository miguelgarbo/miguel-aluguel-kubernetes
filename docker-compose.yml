services:

  backend:
    image: miguelgarbo/miguel_aluguel_back_end:v.3

    container_name: miguel_aluguel_backend_official

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/miguel_aluguel
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      HASH_TOKEN: 
      FRONT_URL: http://18.225.171.75

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  postgres:
    image: postgres:17-alpine

    container_name: miguel_aluguel_postgres

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: miguel_aluguel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_test_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d miguel_aluguel"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  frontend:
    image: miguelgarbo/miguel_aluguel_front_end:v.7

    container_name: miguel_aluguel_frontend

    ports:
      - "80:80"

    environment:
      - VITE_API_URL=http://18.225.171.75:8080/api

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  postgres_test_data: